name: Refresh social preview

on:
  push:
    branches: [main]
    paths-ignore:
      - public/og-image.png
      - public/og-image-en.png
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-preview-main
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build
      - run: npm run capture:og
      - name: Commit updated preview
        run: |
          git add public/og-image.png public/og-image-en.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh social share image"
          git push origin HEAD:main
