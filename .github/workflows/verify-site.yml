name: Verify portfolio

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install chromium --with-deps
      - run: npm run test:browser
      - run: npm run perf:audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-performance
          path: |
            .perf-reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
